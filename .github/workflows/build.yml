name: build

#----- Manual only
on:
  workflow_dispatch:

jobs:
#----- Code validation only, no behaviour is exercised here
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Every module parses
        run: python3 -m compileall -q app
      - name: The package imports
        run: python3 -c "import app.main"
#----- The version names the image and its label;  nothing checks it
      - name: The version
        id: version
        run: |
          version="$(python3 -c 'from app import VERSION; print(VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

#----- Build and publish to GHCR
  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mediaimport
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
