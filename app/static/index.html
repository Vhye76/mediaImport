<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mediaimport</title>
<style>
  /*----- Palette */
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --ink: #e7eaf0; --dim: #98a2b3; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: #235b3a; }
  .pill.bad { color: var(--bad); border-color: #5b2323; }
  .pill.warn { color: var(--warn); border-color: #5b4a23; }
  main { padding: 24px; display: grid; gap: 24px; max-width: 1200px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
               color: var(--dim); margin: 0; padding: 12px 16px;
               border-bottom: 1px solid var(--line); font-weight: 600; }
  .body { padding: 12px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  /*----- Layout */
  .stat { background: #171a20; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line);
           font-size: 13px; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: none; }
  td.name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
            word-break: break-all; }
  button { background: #232833; color: var(--ink); border: 1px solid var(--line);
           border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.bad:hover { border-color: var(--bad); color: var(--bad); }
  .empty { color: var(--dim); padding: 16px; font-style: italic; }
  .reason { color: var(--warn); font-size: 12px; }
  .prog { color: var(--dim); font-size: 12px; }
  .banner { background: #2a1f1f; border-color: #5b2323; color: #fca5a5;
            padding: 10px 16px; font-size: 13px; border-radius: 6px; margin-bottom: 12px; }
  /*----- Comparison dialog */
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           border-radius: 8px; padding: 0; max-width: 1100px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { margin: 0; padding: 12px 16px; font-size: 13px; text-transform: uppercase;
              letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .dlg-body { max-height: 70vh; overflow: auto; }
  .dlg-foot { padding: 10px 16px; border-top: 1px solid var(--line);
              display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .paths { padding: 10px 16px; font-size: 12px; color: var(--dim);
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .paths div { margin: 2px 0; }
  tr.differs td { background: #1f2229; }
  tr.decided td { background: #1d2a20; }
  td.gate { color: var(--dim); font-size: 11px; white-space: nowrap; }
  td.val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           word-break: break-all; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line);
         color: var(--dim); margin-left: 6px; white-space: nowrap; }
  .tag.decided { color: var(--ok); border-color: #235b3a; }
  .tag.ungated { color: var(--warn); border-color: #5b4a23; }
  .note { padding: 8px 16px; font-size: 12px; color: var(--warn);
          border-bottom: 1px solid var(--line); }
  .gone td { opacity: .55; }
</style>
</head>
<body>
<header>
  <h1>mediaimport</h1>
  <span class="pill" id="codec">codec</span>
  <span class="pill" id="gpu">gpu</span>
  <span class="pill" id="encode">encode</span>
  <span class="pill" id="libs">libraries</span>
  <span class="pill" id="dry"></span>
</header>
<main>
  <section>
    <h2>Pipeline</h2>
    <div class="body"><div class="grid" id="stats"></div></div>
  </section>
  <section>
    <h2>Needs a decision</h2>
    <div id="held"></div>
  </section>
  <section>
    <h2>Titles</h2>
    <div id="titles"></div>
  </section>
</main>
<dialog id="cmp">
  <h3 id="cmp-title">Comparison</h3>
  <div id="cmp-notes"></div>
  <div class="paths" id="cmp-paths"></div>
  <div class="dlg-body" id="cmp-body"></div>
  <div class="dlg-foot">
    <span class="pill" id="cmp-verdict"></span>
    <button onclick="$('cmp').close()">Close</button>
  </div>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function pill(el, text, cls) {
  el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}

function gb(n) { return (n / 1e9).toFixed(1) + " GB"; }

//----- Fetch and redraw, every 5 seconds
async function refresh() {
  let s;
  try { s = await (await fetch("/api/status")).json(); }
  catch (e) { return; }

  pill($("codec"), "output " + s.config.OUTPUT_CODEC);
  pill($("gpu"), s.gpu.available ? "gpu ready" : "gpu degraded",
       s.gpu.available ? "ok" : "warn");
  pill($("encode"), "encode " + gb(s.encode.free_bytes) + " free"
       + (s.encode.separate_filesystem ? "" : " (same fs)"),
       s.encode.separate_filesystem ? "" : "warn");
  pill($("libs"), s.libraries_mounted ? "libraries mounted" : "no libraries, comparison off",
       s.libraries_mounted ? "" : "warn");
  pill($("dry"), s.config.DRY_RUN ? "DRY RUN" : "", s.config.DRY_RUN ? "warn" : "");
  $("dry").style.display = s.config.DRY_RUN ? "" : "none";

  const stages = s.stages || {};
  $("stats").innerHTML = [
    ["queue", s.queue_depth],
    ["gpu jobs", s.slots.gpu_active],
    ["cpu jobs", s.slots.cpu_active],
    ["encoding", stages.ENCODING || 0],
    ["held", stages.HELD || 0],
    ["ready to promote", (stages.PUBLISHED || 0) + (stages.CLEANUP || 0)],
    ["quarantined", stages.QUARANTINED || 0],
    ["failed", stages.FAILED || 0],
  ].map(([k, v]) =>
    `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`
  ).join("");

  const held = await (await fetch("/api/held")).json();
  $("held").innerHTML = held.length === 0
    ? '<div class="empty">Nothing is waiting on you.</div>'
    : `<table><tr><th>Source</th><th>Reason</th><th></th></tr>` + held.map(h => `
        <tr>
          <td class="name">${esc(h.source_path.split("/").pop())}</td>
          <td class="reason">${esc(h.reason || "")}</td>
          <td style="white-space:nowrap">
            <button onclick="decide(${h.id},'retry')">Retry</button>
            <button onclick="decide(${h.id},'override')">Force through</button>
            <button class="bad" onclick="decide(${h.id},'discard')">Discard</button>
          </td>
        </tr>`).join("") + `</table>`;

  const prog = s.progress || {};
  const titles = await (await fetch("/api/titles")).json();
  TITLES = {};
  titles.forEach(t => { TITLES[t.id] = t; });
  $("titles").innerHTML = titles.length === 0
    ? '<div class="empty">Nothing has been imported yet.</div>'
    : `<table><tr><th>Source</th><th>Kind</th><th>Stage</th><th>Encoder</th><th>Grain</th><th></th></tr>`
      + titles.slice(0, 60).map(t => `
        <tr class="${t.files_gone ? "gone" : ""}">
          <td class="name">${esc(t.source_path.split("/").pop())}</td>
          <td>${esc(t.kind || "")}</td>
          <td>${esc(t.display_stage || t.stage)}${stageDetail(t, prog[t.id])}${
            t.files_gone ? '<span class="tag">files gone</span>' : ""}</td>
          <td>${esc(t.encoder || "")}</td>
          <td>${t.grain_ratio === null || t.grain_ratio === undefined ? "" : esc(t.grain_ratio)}</td>
          <td style="white-space:nowrap">${
            t.comparison ? `<button onclick="showCompare(${t.id})">Compare</button>` : ""}${
            t.files_gone ? ` <button class="bad" onclick="decide(${t.id},'forget')">Forget</button>` : ""}</td>
        </tr>`).join("") + `</table>`;
}

let TITLES = {};

function cell(v) {
  if (v === null || v === undefined || v === "") return '<td class="val">-</td>';
  if (v === true) return '<td class="val">yes</td>';
  if (v === false) return '<td class="val">no</td>';
  return `<td class="val">${esc(v)}</td>`;
}

async function showCompare(id) {
  let t = TITLES[id];
  try { t = await (await fetch(`/api/titles/${id}`)).json(); } catch (e) {}
  const c = t.comparison || {};
  const out = t.output_probe || null;
  const rows = c.table || [];

  $("cmp-title").textContent = "Comparison - " + (t.title || t.source_path.split("/").pop());

  $("cmp-notes").innerHTML = (c.notes || [])
    .map(n => `<div class="note">${esc(n)}</div>`).join("");

  $("cmp-paths").innerHTML = [
    ["incoming", c.incoming_path],
    ["incumbent", c.incumbent_path],
    ["published", t.output_path],
  ].filter(([, p]) => p).map(([k, p]) =>
    `<div><strong>${esc(k)}</strong> ${esc(p)}</div>`).join("");

  const head = `<tr><th>Attribute</th><th>Gate</th><th>Incoming</th><th>Incumbent</th>${
    out ? "<th>Published</th>" : ""}</tr>`;

  $("cmp-body").innerHTML = `<table>${head}` + rows.map(r => {
    const tags = [];
    if (r.decided) tags.push('<span class="tag decided">decided here</span>');
    if (!r.gate && r.differs && r.measurable) tags.push('<span class="tag ungated">no gate</span>');
    if (r.gate && !r.measurable) tags.push('<span class="tag">not measurable</span>');
    return `<tr class="${r.decided ? "decided" : (r.differs ? "differs" : "")}">
      <td>${esc(r.label || r.attribute)}${tags.join("")}</td>
      <td class="gate">${r.gate ? "gate " + r.gate : ""}</td>
      ${cell(r.incoming)}${cell(r.incumbent)}${out ? cell(out[r.attribute]) : ""}
    </tr>`;
  }).join("") + `</table>`;

  const v = c.verdict || "";
  pill($("cmp-verdict"), `${v}${c.gate ? " at gate " + c.gate : ""}${c.reason ? " - " + c.reason : ""}`,
       v === "win" ? "ok" : (v === "loss" ? "bad" : "warn"));
  $("cmp").showModal();
}

//----- Encode progress, only present while an encoder is running
function stageDetail(t, p) {
  if (!p) return "";
  const bits = [];
  if (p.percent !== undefined && p.percent !== null) bits.push(p.percent.toFixed(1) + "%");
  if (p.eta_s !== undefined && p.eta_s !== null) bits.push(fmtEta(p.eta_s) + " left");
  if (p.speed) bits.push(p.speed + "x");
  return bits.length ? ` <span class="prog">${bits.join(", ")}</span>` : "";
}

function fmtEta(s) {
  if (s < 60) return s + "s";
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? h + "h " + m + "m" : m + "m";
}

//----- Operator actions on a held or failed title
async function decide(id, action) {
  await fetch(`/api/held/${id}/decision`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action}),
  });
  refresh();
}

refresh();
//----- Poll
setInterval(refresh, 5000);
</script>
</body>
</html>
